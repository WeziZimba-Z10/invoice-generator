{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}
  <h1>Settings</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save settings</button>
  </form>
  <p class="helptext">
    Changing your default currency only affects new invoices. Existing invoices
    keep the currency they were created with.
  </p>
{% endblock %}
