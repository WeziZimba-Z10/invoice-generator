{% extends "base.html" %}

{% block title %}Delete client{% endblock %}

{% block content %}
  <h1>Delete client</h1>
  <p>Are you sure you want to delete <strong>{{ client.name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'client_list' %}">Cancel</a>
  </form>
{% endblock %}
